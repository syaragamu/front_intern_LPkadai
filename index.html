<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <title>ティーラボ DeMiA CAFE</title>
</head>
<body>
    <header>
        <img src="img/header/hd_img01_a_sp.jpg" alt="" class = "sp-img" width="100%">
        <img src="img/header/hd_img01_a.jpg" alt="" class = "pc-img" width="100%">
        <img src="img/header/hd_logo.svg" alt="" class="header-message">
        <div class="header-icons">
            <a href=""><img src="img/icon_cart.svg" alt=""></a>
            <a href=""><img src="img/icon_ig.svg" alt=""></a>
            <a href=""><img src="img/icon_menu.svg" alt=""></a>
        </div>
    </header>
    <main>
        <div class = "news">
            <img src="img/news/news_ttl.svg" alt="" class="news-ttl">
            <div class = "news-boxes">
                <div class="news-box">
                    <img src="img/news/tea_day.jpg" alt="" width="100%">
                    <h2 class="news-title">「紅茶の日」</h2>
                    <h4 class="news-content">11月1日は、大黒屋光太夫が日本人として初めて外国の正式な茶会で紅茶を飲んだ日。 <br>2022年11月1日から一週間限定商品を発売予定です。</h4>
                    <h3 class="news-link"><a href="">詳細はこちら</a></h3>
                    <h4 class="news-date bold">2022.09.10</h4>
                </div>
                <div class="news-box">
                    <img src="img/news/notion.jpg" alt="" width="100%">
                    <h2 class="news-title">大切なお知らせ</h2>
                    <h4 class="news-content">この度、創業10周年を記念して、セールを開催します。<br> セールには、定番商品の各種フレーバーからその他のアレンジ商品まで様々なものが対象になっています。<br></h4>
                    <h3 class="news-link"><a href="">詳細はこちら</a></h3>
                    <h4 class="news-date bold">2022.06.30</h4>
                </div>
            </div>
            <button>最新情報はこちら</button>
        </div>

    </main>
    <footer>

    </footer>
</body>
</html>
