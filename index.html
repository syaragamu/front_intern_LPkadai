<!DOCTYPE html>
<html lang="jp">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>課題用コピー</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&amp;display=swap">
        <link rel="shortcut icon" href="img\favicon.svg">
        <link rel="stylesheet" href="CSS/style.css">
        <link rel="stylesheet" href="CSS/common.css">
        <link rel="stylesheet" href="CSS/header.css">
        <link rel="stylesheet" href="CSS/news.css">
    </head>
    <body>
        <header class="header">
            <img src="img\header\hd_img01_a.jpg" alt="背景画像 PC" class="hd-img pc">
            <img src="img\header\hd_img01_a_sp.jpg" alt="背景画像 SP" class="hd-img sp">
            <img src="img\header\hd_logo.svg" alt="ロゴ" class="hd-logo">
            <ul class="hd-icons">
                <li class="hd-icon"><a href="#"><img src="img/icon_cart.svg" alt="アイコン カート" width="100%" height="100%"></a></li>
                <li class="hd-icon"><a href="#"><img src="img/icon_ig.svg" alt="アイコン インスタ" width="100%" height="100%"></a></li>
                <li class="hd-icon"><a href="#"><img src="img/icon_menu.svg" alt="アイコン メニュー" width="100%" height="100%"></a></li>
            </ul>    
        </header>
        <main>
            <section class="news">
                <div class="news-top">
                    <div class="news-title"><img src="img/news/news_ttl.svg" alt="ニュースタイトル" width="35%" height="auto"></div>
                    <div class="ig-container">
                        <a href="#" style="text-decoration:none;" class="news-ig">
                            <div class="ig-contents">
                                <img src="img/icon_ig.svg" alt="アイコン インスタ" width="10%" height="auto">
                                <span class="ig-text">最新情報はこちら</span>
                            </div>
                        </a>   
                    </div>
                </div>
                <div class="articles">
                    <div class="article">
                        <img src="img/news/tea_day.jpg" alt="紅茶の日" width="100%" height="auto">
                        <div class="article-title">「紅茶の日」</div>
                        <div class="article-text">11月1日は、大黒屋光太夫が日本人として初めて外国の正式な茶会で紅茶を飲んだ日。<br>2022年11月1日から一週間限定商品を発売予定です。</div>
                        <div class="article-link"><a href="#">詳細はこちら</a></div>
                        <div class="article-date">2022.09.10</div>
                    </div>
                    <div class="article">
                        <img src="img/news/notion.jpg" alt="大切なお知らせ" width="100%" height="auto">
                        <div class="article-title">大切なお知らせ</div>
                        <div class="article-text">この度、創業10周年を記念して、セールを開催します。<br>セールには、定番商品の各種フレーバーティーからその他アレンジ商品まで様々なものが対象になっています。</div>
                        <div class="article-link"><a href="#">詳細はこちら</a></div>
                        <div class="article-date">2022.06.30</div>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
