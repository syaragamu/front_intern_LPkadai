<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ティーラボ Demia CAFE</title>
    <link rel="icon" href="img/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
    <header class="hero-section">
        <picture>
            <source media="(max-width: 768px)" srcset="img/header/hd_img01_a_sp.jpg" class="bg-image">
            <img src="img/header/hd_img01_a.jpg" alt="" class="bg-image">
        </picture>
        <div class="header-content">
            <div class="icon">
                <a href="#">
                    <img src="img/icon_cart.svg" alt="">
                    <img src="img/icon_ig.svg" alt="">
                    <img src="img/icon_menu.svg" alt="">
                </a>
            </div>
        </div>
        <div class="logo"><img src="img/header/hd_logo.svg" alt=""></div>
    </header>
    <main>
        <section class="news-section">
            <h2 class="news-img1"><img src="img/news/news_ttl.svg" alt=""></h2>
            <div class="wrapper1 up">
                <a href="#" class="news-icon">
                    <img src="img/icon_ig.svg" alt="">
                    <div> 最新情報はこちら</div>
                </a>
            </div>
            <div class="news-wrapper">
                <div class="news1">
                    <img src="img/news/tea_day.jpg" alt="" class="news-img2">
                    <div class="big-text">「紅茶の日」</div>
                    <div class="little-text">
                        11月1日は、大黒屋光太夫が日本人として初めて外国の正式な茶会で紅茶を飲んだ日。<br>
                        2022年11月1日から一週間限定商品を発売予定です。
                    </div>
                    <a href="#" class="detail">詳細はこちら</a>
                    <div class="line"></div>
                    <div class="date">2022.09.10</div>
                </div>
                <div class="news1">
                    <img src="img/news/notion.jpg" alt="" class="news-img2">
                    <div class="big-text">大切なお知らせ</div>
                    <div class="little-text">
                        この度、創業10周年を記念して、セールを開催します。<br>
                        セールには、定番商品の各種フレーバーティーからその他アレンジ商品まで様々なものが対象になっています。
                    </div>
                    <a href="#" class="detail">詳細はこちら</a>
                    <div class="date">2022.06.30</div>
                </div>
            </div>
            <div class="wrapper1 down">
                <a href="#" class="news-icon">
                    <img src="img/icon_ig.svg" alt="">
                    <div> 最新情報はこちら</div>
                </a>
            </div>
        </section>
        <section class="about">
            <div></div>
        </section>
    </main>
    <footer>

    </footer>
</body>

</html>
