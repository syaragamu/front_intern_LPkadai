<!DOCTYPE html>
<html lang="jp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="product.css">
    <link rel="icon" href="img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <title>Product</title>
</head>
<body>
    <div class="overall-content">
        <div class="item">
            <div class="tea-content">
                <img src="img/products/products_tea.jpg" alt="" class="tea-img">
                <div class="content1">
                    <h1>セイロンティー</h1>
                    <main>スリランカの中でも世界三大紅茶として知られるウバで生産された爽やかな香りが特徴のセイロンティー。 <br>ミルクティーにすることでフルーツのような香りへの変化を楽しむことができます。</main>
                    <footer>S size : 100g/2000yen (Tax in) <br>M size : 200g/3500yen (Tax in) </footer>
                </div>
            </div>
            <img src="img/products/products_ttl_tea.svg" alt="" class="tea-title">
        </div>
        <div class="item">
            <div class="scone-content">
                <img src="img/products/products_scone.jpg" alt="" class="scone-img">
                <div class="content2">
                    <h1>スコーン</h1>
                    <main>世界中の小麦粉を取り寄せ、我がカフェ独自の生地の配合を研究し、お茶菓子としては究極の域に達したスコーン。</main>
                    <footer>240g/900yen (Tax in) </footer>
                </div>
            </div>
            <img src="img/products/products_ttl_scone.svg" alt="" class="scone-title">
        </div>
    </div>
</body>
</html>
